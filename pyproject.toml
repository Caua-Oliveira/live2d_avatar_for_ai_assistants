[project]
name = "university-ai-backend"
version = "0.1.0"
description = "Gemini Live backend and Live2D assistant interface for Jorgina"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "httpx",
    "google-genai>=2.34,<3",
    "pydantic",
    "pydantic-settings",
    "uvicorn[standard]",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
